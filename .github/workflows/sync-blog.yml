name: Sync Blog to Jekyll (blog_jack)

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**/*.md'
      - 'scripts/sync-to-jekyll.py'
      - '.github/workflows/sync-blog.yml'
  workflow_dispatch:

jobs:
  sync-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aifel_work
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # blog_jack은 별도 저장소이므로, PAT_TOKEN 시크릿으로 clone/push 합니다.
      # 설정 방법은 BLOG_GUIDE.md 참고: Settings → Secrets and variables → Actions
      # → New repository secret → 이름: PAT_TOKEN, 값: repo 권한을 가진 GitHub PAT
      - name: Clone blog_jack
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git clone https://x-access-token:${PAT_TOKEN}@github.com/tickle1231102-cmd/blog_jack.git blog_jack_repo

      - name: Sync markdown posts into blog_jack/_posts
        run: |
          BLOG_JACK_PATH="$GITHUB_WORKSPACE/blog_jack_repo" python3 scripts/sync-to-jekyll.py

      - name: Commit and push to blog_jack
        working-directory: blog_jack_repo
        run: |
          git config user.name "Blog Jack Bot"
          git config user.email "bot@blogjack.local"

          if [ -n "$(git status --porcelain)" ]; then
            git add _posts
            git commit -m "Auto sync posts from aifel_work: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "✅ blog_jack 동기화 완료 — Jekyll(GitHub Pages)이 자동으로 빌드합니다"
          else
            echo "ℹ️ 변경된 글이 없습니다"
          fi
