name: Sync Blog - MD to HTML

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**/*.md'
      - '.github/workflows/sync-blog.yml'
      - 'scripts/md-to-html.py'
  workflow_dispatch:

jobs:
  sync-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout aifel_work
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install markdown pygments

      - name: Run MD to HTML conversion
        run: |
          python scripts/md-to-html.py

      - name: Commit and push to blog_jack
        run: |
          cd blog_jack
          git config --global user.name "Blog Jack Bot"
          git config --global user.email "bot@blogjack.local"

          # 변경사항 확인
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto sync from aifel_work: $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "✅ Blog Jack 동기화 완료"
          else
            echo "ℹ️ 변경사항 없음"
          fi
        env:
          GIT_AUTHOR_NAME: Blog Jack Bot
          GIT_AUTHOR_EMAIL: bot@blogjack.local
          GIT_COMMITTER_NAME: Blog Jack Bot
          GIT_COMMITTER_EMAIL: bot@blogjack.local

      - name: Update sync timestamp
        run: |
          echo "마지막 동기화: $(date +'%Y-%m-%d %H:%M:%S')" > sync-timestamp.txt
          git add sync-timestamp.txt
          git commit -m "Update sync timestamp" || true
          git push origin main || true
